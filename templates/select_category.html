{% extends "base.html" %}
{% block title %}Select Vehicle Category{% endblock %}

{% block content %}
<div class="page" style="max-width:700px;margin:0 auto;">
  <div style="margin-bottom:32px;">
    <a href="{{ url_for('dashboard') }}" class="text-muted" style="font-size:.9rem;">← Back to Dashboard</a>
    <h1 style="font-size:1.8rem;font-weight:800;margin-top:16px;margin-bottom:8px;">Select Vehicle Category</h1>
    <p class="text-muted">The repair cost estimate varies by vehicle type.</p>
  </div>

  <form method="POST">
    <div class="grid-2" style="margin-bottom:32px;">

      <label class="category-card" for="eco">
        <input type="radio" name="category" id="eco" value="economy" required hidden/>
        <div class="cat-icon">🚗</div>
        <div class="cat-title">Economy</div>
        <div class="cat-desc">Budget-friendly vehicles, standard parts</div>
        <div class="cat-mult">1.0× multiplier</div>
      </label>

      <label class="category-card" for="mid">
        <input type="radio" name="category" id="mid" value="mid-range" hidden/>
        <div class="cat-icon">🚙</div>
        <div class="cat-title">Mid-Range</div>
        <div class="cat-desc">Family sedans, SUVs, crossovers</div>
        <div class="cat-mult">1.4× multiplier</div>
      </label>

      <label class="category-card" for="lux">
        <input type="radio" name="category" id="lux" value="luxury" hidden/>
        <div class="cat-icon">🏎️</div>
        <div class="cat-title">Luxury</div>
        <div class="cat-desc">Premium brands, high-end materials</div>
        <div class="cat-mult">2.0× multiplier</div>
      </label>

      <label class="category-card" for="spt">
        <input type="radio" name="category" id="spt" value="sports" hidden/>
        <div class="cat-icon">🏁</div>
        <div class="cat-title">Sports</div>
        <div class="cat-desc">Performance vehicles, exotic parts</div>
        <div class="cat-mult">2.5× multiplier</div>
      </label>

    </div>
    <button type="submit" class="btn btn-primary btn-lg btn-block">Continue to Upload →</button>
  </form>
</div>

<style>
  .category-card{
    background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);
    padding:28px;cursor:pointer;transition:all .2s;display:block;
  }
  .category-card:hover{border-color:var(--primary);background:rgba(99,102,241,.07);}
  .category-card:has(input:checked){border-color:var(--primary);background:rgba(99,102,241,.12);
    box-shadow:0 0 0 3px rgba(99,102,241,.2);}
  .cat-icon{font-size:2.5rem;margin-bottom:12px;}
  .cat-title{font-size:1.1rem;font-weight:700;margin-bottom:6px;}
  .cat-desc{color:var(--muted);font-size:.88rem;margin-bottom:8px;}
  .cat-mult{font-size:.82rem;color:var(--primary-light);font-weight:600;}
</style>
{% endblock %}
